name: Public tree hygiene

# The denylist secret must never be reachable from code a pull request controls. This workflow runs
# in the base repository's context (`pull_request_target`): the workflow file and the checker come
# from the trusted base commit, and the candidate is checked out only as data. No candidate code is
# executed. Direct pushes to `main` are blocked by the `main-pr-only` ruleset, so every merged tree
# was scanned at its pull request head. There is deliberately no push or manual trigger: either
# would run a caller-selected checker with the secret.

on:
  # zizmor: ignore[dangerous-triggers] -- the candidate is checked out as data only; the checker
  # and this workflow come from the trusted base commit, and no candidate code is executed.
  pull_request_target:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pii-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  scan:
    name: Scan tracked files for protected identifiers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the trusted checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          persist-credentials: false

      - name: Checkout the candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: candidate
          persist-credentials: false

      - name: Scan
        env:
          HERMES_PUBLIC_PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
          HERMES_PUBLIC_PII_REQUIRE: '1'
        run: |
          set -euo pipefail
          python3 scripts/ci/check_public_pii.py --repo candidate
