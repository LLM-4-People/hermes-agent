name: Automated SemVer Release

# Fork-owned code-driven SemVer tag & GitHub Release automation.
# Uses scripts/release_plan.py (SSoT):
#   - Honors `skip-release` and explicit `release: major|minor|patch` labels (fail-closed on conflict)
#   - Automatically classifies merged runtime code changes on `main` via Conventional Commits
#     (skipping docs-only, tests-only, evals-only, and CI/scripts-only merges)
#   - Supports manual `workflow_dispatch` with a bump level or explicit `vMAJOR.MINOR.PATCH` tag.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'SemVer bump level (ignored if explicit tag is set)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      tag:
        description: 'Optional explicit SemVer tag (vMAJOR.MINOR.PATCH)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish SemVer release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}

      - name: Resolve next release plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tags_file="$(mktemp)"
          trap 'rm -f "$tags_file"' EXIT
          git tag --list 'v*' > "$tags_file"

          labels_json="[]"
          files_json="[]"
          pr_title=""
          pr_body=""

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            pulls_json="$(gh api "repos/${REPO}/commits/${COMMIT_SHA}/pulls" 2>/dev/null || echo '[]')"
            labels_json="$(python3 -I - "$pulls_json" <<'PY'
          import json, sys
          pulls = json.loads(sys.argv[1]) if sys.argv[1].strip() else []
          labels = sorted({
              str(lbl.get("name", "")).strip()
              for pr in pulls if isinstance(pr, dict)
              for lbl in (pr.get("labels") or [])
              if isinstance(lbl, dict) and str(lbl.get("name", "")).strip()
          })
          print(json.dumps(labels))
          PY
          )"

            pr_number="$(python3 -I - "$pulls_json" <<'PY'
          import json, sys
          pulls = json.loads(sys.argv[1]) if sys.argv[1].strip() else []
          print(pulls[0].get("number", "") if pulls and isinstance(pulls[0], dict) else "")
          PY
          )"

            if [ -n "$pr_number" ]; then
              pr_title="$(python3 -I - "$pulls_json" <<'PY'
          import json, sys
          pulls = json.loads(sys.argv[1])
          print(str(pulls[0].get("title") or ""))
          PY
          )"
              pr_body="$(python3 -I - "$pulls_json" <<'PY'
          import json, sys
          pulls = json.loads(sys.argv[1])
          print(str(pulls[0].get("body") or ""))
          PY
          )"
              files_raw="$(gh api "repos/${REPO}/pulls/${pr_number}/files" --paginate --jq '.[].filename' 2>/dev/null || true)"
              if [ -n "$files_raw" ]; then
                files_json="$(python3 -I - "$files_raw" <<'PY'
          import json, sys
          files = [line.strip() for line in sys.argv[1].splitlines() if line.strip()]
          print(json.dumps(files))
          PY
          )"
              fi
            fi

            if [ -z "$pr_title" ]; then
              pr_title="$(git log -1 --format=%s "$COMMIT_SHA")"
              pr_body="$(git log -1 --format=%b "$COMMIT_SHA")"
            fi

            if [ "$files_json" = "[]" ]; then
              if [ -n "$BEFORE_SHA" ] && [[ ! "$BEFORE_SHA" =~ ^0+$ ]]; then
                changed_raw="$(git diff --name-only "${BEFORE_SHA}..${COMMIT_SHA}")"
              else
                changed_raw="$(git diff-tree --no-commit-id --name-only -r "$COMMIT_SHA")"
              fi
              files_json="$(python3 -I - "$changed_raw" <<'PY'
          import json, sys
          files = [line.strip() for line in sys.argv[1].splitlines() if line.strip()]
          print(json.dumps(files))
          PY
          )"
            fi
          fi

          plan_json="$(python3 -I scripts/release_plan.py \
            --event "$EVENT_NAME" \
            --labels-json "$labels_json" \
            --changed-files-json "$files_json" \
            --tags-file "$tags_file" \
            --title "$pr_title" \
            --body "$pr_body" \
            --input-bump "$INPUT_BUMP" \
            --input-tag "$INPUT_TAG" \
            --github-output "$GITHUB_OUTPUT" \
            --json)"

          echo "$plan_json"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            python3 -I - "$plan_json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          plan = json.loads(sys.argv[1])
          with open(sys.argv[2], "a", encoding="utf-8") as fh:
              fh.write("### Automated release plan\n\n")
              fh.write(f"- Should release: `{plan['should_release']}`\n")
              fh.write(f"- Tag: `{plan['tag'] or 'none'}`\n")
              fh.write(f"- Bump: `{plan['bump']}`\n")
              fh.write(f"- Trigger source: `{plan['trigger_source']}`\n")
              fh.write(f"- Reason: {plan['reason']}\n")
              if plan["shippable_files"]:
                  preview = ", ".join(f"`{p}`" for p in plan["shippable_files"][:10])
                  extra = len(plan["shippable_files"]) - 10
                  suffix = f" (+{extra} more)" if extra > 0 else ""
                  fh.write(f"- Shippable files: {preview}{suffix}\n")
          PY
          fi

      - name: Create annotated tag, GitHub Release, and trigger container build
        if: steps.plan.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN || github.token }}
          HAS_RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN != '' }}
          TAG: ${{ steps.plan.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$COMMIT_SHA" -m "Release $TAG"
          if ! git push origin "refs/tags/$TAG"; then
            if [ "$HAS_RELEASE_BOT_TOKEN" != "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### Tag push blocked"
                echo ""
                echo "Pushing \`refs/tags/${TAG}\` failed using default \`GITHUB_TOKEN\`."
                echo "If a repository tag ruleset protects \`v*\` tags, configure repository secret \`RELEASE_BOT_TOKEN\` with tag push permission."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::error::Failed to push tag ${TAG}. Configure RELEASE_BOT_TOKEN if protected by a tag ruleset." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --title "Hermes Agent $TAG" \
            --generate-notes \
            --verify-tag
          # Trigger docker-publish explicitly because GITHUB_TOKEN tag pushes do not fire push workflows.
          gh workflow run docker-publish.yml --ref "$TAG"
